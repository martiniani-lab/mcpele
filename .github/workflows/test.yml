name: Tests

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  # the README install, verbatim: conda env (unpinned), then pip install pele and mcpele;
  # then test the installed package from outside the source tree
  pip-install:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # newest Python (unpinned); Ubuntu uses the system compilers, macOS conda's
        include:
          - {os: ubuntu-24.04, compilers: ""}
          - {os: macos-latest, compilers: compilers}
    runs-on: ${{ matrix.os }}
    name: pip-install (${{ matrix.os }}${{ matrix.compilers && ', conda compilers' || '' }})
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ""

      - name: Create environment
        run: conda create -y -n mcpele -c conda-forge python sundials eigen blas-devel ${{ matrix.compilers }}

      - name: pip install pele
        run: |
          conda activate mcpele
          python --version
          python -m pip install git+https://github.com/martiniani-lab/pele -v

      - name: pip install mcpele
        run: |
          conda activate mcpele
          python -m pip install . -v

      - name: Test installed package with coverage
        run: |
          conda activate mcpele
          python -m pip install pytest pytest-cov
          cd "$RUNNER_TEMP"
          OMP_NUM_THREADS=1 python -m pytest --pyargs mcpele -v \
            --cov=mcpele --cov-report=xml:"$GITHUB_WORKSPACE/coverage.xml" --cov-report=term-missing

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-24.04'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: python
          fail_ci_if_error: false
